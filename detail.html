<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Honda | Alya Honda</title><style>body{margin:0;font-family:Arial, sans-serif;color:#121820;background:#f6f7f8}.wrap{width:min(1100px,92%);margin:auto}.top{background:#080c12;color:#fff;padding:18px 0}.top a{color:#fff;text-decoration:none}.hero{padding:35px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.photo{background:#fff;border-radius:25px;overflow:hidden;border:1px solid #e3e6e9}.photo img{width:100%;display:block}.k{color:#e50916;font-size:11px;font-weight:900;letter-spacing:2px}.h{font-family:Georgia,serif;font-size:50px;margin:8px 0}.price{font-size:26px;font-weight:900}.small{font-size:11px;color:#77808a;line-height:1.6}.btn{display:inline-block;padding:14px 18px;border-radius:11px;text-decoration:none;font-weight:900;font-size:12px;margin:6px 6px 6px 0}.red{background:#e50916;color:#fff}.dark{background:#111820;color:#fff}.box{background:#fff;border:1px solid #e3e6e9;border-radius:20px;padding:24px;margin:20px 0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 11px;background:#f0f2f4;border-radius:999px;font-size:10px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr}.h{font-size:40px}}</style></head><body><div class="top"><div class="wrap"><a href="index.html">← Kembali ke katalog Alya Honda</a></div></div><main class="wrap hero" id="app"></main><script src="data.js"></script><script>const id=new URLSearchParams(location.search).get('model');const all=[...SITE.cars,...SITE.legacy];const c=all.find(x=>x.id===id)||SITE.cars[0];const WA=t=>`https://wa.me/${SITE.phoneWa}?text=${encodeURIComponent(t)}`;document.title=c.name+' | Alya Honda';document.getElementById('app').innerHTML=`<div class="grid"><div class="photo"><img src="${c.image}" alt="${c.name}"></div><div><div class="k">${c.category}</div><div class="h">${c.name}</div><div class="price">${c.price}</div><div class="small">${c.priceType||'Model legacy / bukan unit baru'}</div><p>${c.description}</p><a class="btn red" target="_blank" href="${WA(`Halo Alya, saya tertarik dengan ${c.name}. Mohon info harga OTR Sragen, promo dan ketersediaan.`)}">💬 Tanya Alya</a><a class="btn dark" href="index.html#konsultasi">📝 Konsultasi</a></div></div><div class="box"><h2>Fitur / Informasi</h2><div class="chips">${(c.features||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div></div><div class="box"><h2>Varian</h2><div class="chips">${(c.variants||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div><h2>Warna</h2><div class="chips">${(c.colors||[]).map(x=>`<span class="chip">${x}</span>`).join('')}</div><p class="small">Data produk dan harga dapat berubah. Gunakan tombol WhatsApp untuk meminta OTR Sragen dan promo terbaru. <a href="${c.source}" target="_blank">Lihat sumber Honda Indonesia</a>.</p></div>`;</script></body></html>
